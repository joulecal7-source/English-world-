function activateAudio() {
  document.getElementById('audio-banner').style.display = 'none';
  document.getElementById('audio-confirmed').style.display = 'flex';
  speak("Audio activated! Welcome to EnglishWorld!");
}

function speak(text) {
  if(!text) return;
  // Method 1: ResponsiveVoice
  if(window.responsiveVoice && window.responsiveVoice.voiceSupport()) {
    window.responsiveVoice.cancel();
    window.responsiveVoice.speak(text, "UK English Male", {rate:0.9, pitch:1, volume:1});
    return;
  }
  // Method 2: Native speech synthesis
  if(window.speechSynthesis) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85; u.volume = 1;
    // Force load voices
    const voices = window.speechSynthesis.getVoices();
    if(voices.length > 0) {
      const en = voices.find(v => v.lang.startsWith('en')) || voices[0];
      u.voice = en;
    }
    window.speechSynthesis.speak(u);
  }
}

// ==================== LANGUAGE ====================
function toggleLang() {
  lang = lang === "fr" ? "en" : "fr";
  document.getElementById('lang-btn').textContent = lang === "fr" ? "🇬🇧 EN" : "🇫🇷 FR";
  document.getElementById('tab-lessons').textContent = lang === "fr" ? "Leçons" : "Lessons";
  document.getElementById('tab-tutor').textContent = lang === "fr" ? "Tuteur IA" : "AI Tutor";
  document.getElementById('tab-vocab').textContent = lang === "fr" ? "Vocabulaire" : "Vocabulary";
  document.getElementById('tab-program').textContent = lang === "fr" ? "Programme" : "Program";
  renderContent();
}

// ==================== TABS ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const tabs = ['lessons','tutor','vocab','program'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  renderContent();
}

// ==================== RENDER ====================
function renderContent() {
  const c = document.getElementById('content');
  if(currentTab === 'lessons') c.innerHTML = renderLessons();
  else if(currentTab === 'tutor') c.innerHTML = renderTutor();
  else if(currentTab === 'vocab') c.innerHTML = renderVocab();
  else if(currentTab === 'program') c.innerHTML = renderProgram();
}

// ==================== ACTIONS ====================
function selectLesson(i) {
  currentLesson = i;
  audioPlaying = false;
  audioPct = 0;
  clearInterval(audioTimer);
  if(window.responsiveVoice) window.responsiveVoice.cancel();
  else if(window.speechSynthesis) window.speechSynthesis.cancel();
  renderContent();
}

function toggleAudio() {
  audioPlaying = !audioPlaying;
  if(audioPlaying) {
    speak(lessons[currentLesson].audio);
    audioTimer = setInterval(() => {
      audioPct = Math.min(100, audioPct + 0.06);
      const fill = document.getElementById('progress-fill');
      if(fill) fill.style.width = audioPct + '%';
      if(audioPct >= 100) { audioPlaying = false; clearInterval(audioTimer); }
    }, 1000);
  } else {
    clearInterval(audioTimer);
    if(window.responsiveVoice) window.responsiveVoice.cancel();
    else if(window.speechSynthesis) window.speechSynthesis.cancel();
  }
  document.getElementById('play-btn').innerHTML = audioPlaying ? "⏸" : "▶";
  document.getElementById('play-btn').className = audioPlaying ? "play-btn playing" : "play-btn";
}

function markComplete() {
  progress[currentLesson] = true;
  renderContent();
}

function nextLesson() {
  if(currentLesson < lessons.length - 1) {
    currentLesson++;
    audioPlaying = false; audioPct = 0;
    clearInterval(audioTimer);
    renderContent();
  }
}

function toggleMonth(m) {
  expandedMonth = expandedMonth === m ? null : m;
  renderContent();
}

function setInput(text) {
  document.getElementById('chat-input').value = text;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  messages.push({role:'user', text});
  input.value = '';
  renderContent();
  setTimeout(() => {
    const cm = document.getElementById('chat-messages');
    if(cm) cm.scrollTop = cm.scrollHeight;
  }, 50);
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:800,
        system:`You are Teacher Joule Musuwa's AI English tutor. Teaching English since 2003. Always respond in BOTH English and French:\n🇬🇧 English: [answer]\n🇫🇷 Français: [answer]\nBe warm, clear, encouraging. End with "Bravo! Keep going! / Continuez !"`,
        messages: messages.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role==='ai'?'assistant':m.role, content:m.text}))
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || "🇬🇧 Error.\n🇫🇷 Erreur.";
    messages.push({role:'ai', text:reply});
    const enPart = reply.split('🇫🇷')[0].replace('🇬🇧 English:','').trim();
    speak(enPart);
  } catch(e) {
    messages.push({role:'ai', text:"🇬🇧 Connection error. Please try again.\n🇫🇷 Erreur de connexion. Réessayez."});
  }
  renderContent();
  setTimeout(() => {
    const cm = document.getElementById('chat-messages');
    if(cm) cm.scrollTop = cm.scrollHeight;
  }, 100);
}

// ==================== INIT ====================
renderContent();
// Load voices for speech synthesis
if(window.speechSynthesis) window.speechSynthesis.getVoices();
window.speechSynthesis && window.addEventListener('load', () => window.speechSynthesis.getVoices());
</script>
